# 复制为程序旁的 tray.yaml 即可双击启动；也可用 --config 指定其他配置。
# 相对文件路径以本配置所在目录为基准，不依赖启动工作目录。
hub_url: "http://127.0.0.1:18700"
# token: "${env:AGENT_PULSE_TOKEN}"
# relay_url: "https://relay.example.invalid"
# relay_token: "${env:AGENT_PULSE_RELAY_TOKEN}"

# 省略时使用本配置所在目录中的 data/state.json。
# 悬浮偏好位于 data/desktop.json；开机自动启动状态以 Windows 系统登记为准。
# 应用在当前 Windows 登录会话中仅允许运行一个实例。
# state_file: "data/tray-state.json"

# 可选：只管理本客户端启动的 Windows Bridge，退出时停止。
# bridge_enabled: true
# bridge_config: "bridge.local.yaml"
