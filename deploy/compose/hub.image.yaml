# 使用包含已签名适配仓库的正式发布镜像；默认只挂载持久数据卷。
services:
  hub:
    image: ${AGENT_PULSE_HUB_IMAGE:?请设置 Hub 镜像完整名称和版本}
    restart: unless-stopped
    ports: ["${HUB_BIND_IP:-127.0.0.1}:18700:18700"]
    environment:
      AGENT_PULSE_TOKEN: ${AGENT_PULSE_TOKEN:-}
      AGENT_PULSE_RELAY_URL: ${AGENT_PULSE_RELAY_URL:-}
      AGENT_PULSE_RELAY_TOKEN: ${AGENT_PULSE_RELAY_TOKEN:-}
    volumes:
      - hub-data:/data
      # 高级用途：挂载自定义运行配置或替换已验签的发布仓库。
      # - ./hub.custom.yaml:/etc/agent-pulse/hub.yaml:ro
      # - ./repository:/repository:ro
volumes:
  hub-data:
