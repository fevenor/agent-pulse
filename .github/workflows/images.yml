name: 检查与发布镜像

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      VOLTA_FEATURE_PNPM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: volta-cli/action@v4
        with:
          node-version: '24.14.1'
      - name: 安装锁定依赖
        run: |
          volta install pnpm@10.33.2
          pnpm --dir adapters/opencode install --frozen-lockfile --ignore-scripts
          pnpm --dir web/hub install --frozen-lockfile --ignore-scripts
      - name: 后端、适配器和页面检查
        run: bash scripts/check.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: 跨平台适配包合并检查
        run: uv run --offline --no-project python scripts/test_merge_adapter_repositories.py
      - name: 构建 Linux 与通用适配包
        run: bash scripts/package-adapters.sh ./dist/repository 1
      - uses: actions/upload-artifact@v7
        with:
          name: linux-adapters
          path: |
            dist/repository/index-input.json
            dist/repository/packages/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: 构建并运行两种架构的镜像
        run: |
          mkdir -p dist/verification
          for arch in amd64 arm64; do
            for component in hub relay; do
              docker buildx build --platform "linux/$arch" --target "$component" \
                -f deploy/docker/Dockerfile --load -t "agent-pulse-$component:test-$arch" .
            done
            uv run --offline --no-project python tests/e2e/relay_containers.py \
              --arch "$arch" --hub-image "agent-pulse-hub:test-$arch" \
              --relay-image "agent-pulse-relay:test-$arch" \
              > "dist/verification/containers-$arch.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: 容器验证结果
          path: dist/verification/containers-*.json
          if-no-files-found: error
      - name: 登录 GitHub 镜像仓库
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布通过测试的双架构镜像
        if: github.event_name == 'push'
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image_repository="${IMAGE_REPOSITORY,,}"
          for component in hub relay; do
            image="$image_repository/$component"
            tags=(--tag "$image:sha-$GITHUB_SHA")
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              tags+=(--tag "$image:$GITHUB_REF_NAME")
            elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              tags+=(--tag "$image:latest")
            fi
            docker buildx build --platform linux/amd64,linux/arm64 --target "$component" \
              -f deploy/docker/Dockerfile "${tags[@]}" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" --push .
          done
