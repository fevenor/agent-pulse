# AgentPulse 的 bundle 层：插入一个 Host 插件行。config 留空时插件保持未启用；
# 请在当前 profile 的 cordis.patch.yml 中以相同的 id 覆盖 config（source_id、bridge_address）。
# 由 Bridge 受管理安装时不要安装本 bundle，Bridge 会在 profile 中直接插入指向固定 loader 的同名行。
- insert:
    - id: agent-pulse
      name: './index.js'
      config:
        source_id: ""
        bridge_address: ""
